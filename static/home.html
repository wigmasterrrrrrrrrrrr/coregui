<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TurboWarp</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/images/192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/images/512.png">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <style>
        :root {
            color-scheme: light dark;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fff4f4 0%, #eef6ff 100%);
            color: #1f2937;
        }
        .card {
            width: min(92vw, 720px);
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: 0 24px 80px rgba(31, 41, 55, 0.16);
            padding: 2.25rem;
        }
        h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(2rem, 4vw, 2.8rem);
        }
        p {
            line-height: 1.6;
            margin: 0 0 1.25rem;
            color: #4b5563;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        a.button {
            display: inline-block;
            padding: 0.8rem 1.1rem;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            background: #ff4c4c;
            color: white;
        }
        a.button.secondary {
            background: #4c97ff;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
                color: #f9fafb;
            }
            .card {
                background: rgba(17, 24, 39, 0.9);
                box-shadow: 0 24px 80px rgba(0,0,0,0.35);
            }
            p {
                color: #d1d5db;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>TurboWarp</h1>
        <p>Run Scratch projects faster with a faster player, extra editor tools, and a smoother experience.</p>
        <div class="actions">
            <a class="button" href="/editor">Open the editor</a>
            <a class="button secondary" href="/addons">Open addon settings</a>
        </div>
    </main>
</body>
</html>
